# Tenka · kitty
include theme.conf
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
font_size        11.5
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono
disable_ligatures never
window_padding_width 22 26
# glass: Hyprland blurs what is behind; 0.74 keeps ink under text and lets the art through (perf mode: 0.96)
background_opacity 0.74
dynamic_background_opacity yes
confirm_os_window_close 0
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0.6
tab_bar_style powerline
tab_powerline_style round
enable_audio_bell no
remember_window_size no
initial_window_width 110c
initial_window_height 30c
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
# performance mode (no blur) makes the glass denser here; tenka-perf writes this file
include perf.conf

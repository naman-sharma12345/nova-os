# Tianxia prompt, generated by scripts/gen-themes.py: quiet, one accent
add_newline = true
palette = "tenka"
format = """$directory$git_branch$git_status$python$rust$nodejs$cmd_duration
$character"""
[palettes.tenka]
accent = "#5fc9a0"
gold = "#e2bd6b"
paper = "#eef3ec"
mist = "#a9bdb4"
ink = "#1d332e"
[directory]
style = "gold"
truncation_length = 3
truncation_symbol = "…/"
[git_branch]
symbol = " "
style = "italic mist"
[git_status]
style = "accent"
[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](bold #f0a3b8)"
[cmd_duration]
style = "mist"
format = " [$duration]($style)"

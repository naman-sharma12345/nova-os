# Tenka prompt, generated by scripts/gen-themes.py: quiet, one accent
add_newline = true
palette = "tenka"
format = """$directory$git_branch$git_status$python$rust$nodejs$cmd_duration
$character"""
[palettes.tenka]
accent = "#d8412f"
gold = "#c9a35a"
paper = "#efe6d6"
mist = "#b8ab96"
ink = "#2a2522"
[directory]
style = "gold"
truncation_length = 3
truncation_symbol = "…/"
[git_branch]
symbol = " "
style = "italic mist"
[git_status]
style = "accent"
[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](bold #f2a7b5)"
[cmd_duration]
style = "mist"
format = " [$duration]($style)"

-- Tenka Lite: the desktop title card (clock, seal, date, proverb) drawn by conky + cairo,
-- mirroring the Tenka shell's desk. Colours and words come from ~/.config/tenka/shell-theme.json.
conky.config = {
    lua_load = '/usr/share/tenka/conky/desk.lua',
    lua_draw_hook_pre = 'tenka_desk',
    own_window = true, own_window_type = 'desktop', own_window_class = 'tenka-desk',
    own_window_transparent = true, own_window_argb_visual = true, own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    alignment = 'top_left', gap_x = 0, gap_y = 0,
    minimum_width = 1100, minimum_height = 760, maximum_width = 1100,
    double_buffer = true, update_interval = 1, total_run_times = 0,
    background = false, draw_shades = false, draw_outline = false, draw_borders = false,
    use_xft = true, cpu_avg_samples = 1, no_buffers = true,
}
conky.text = [[ ]]

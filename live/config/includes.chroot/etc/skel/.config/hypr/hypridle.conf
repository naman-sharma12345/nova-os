general {
    lock_cmd = pidof hyprlock || tenka-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
# The Drift (Tianxia: The Falling Blossoms): the season falling across the desk two minutes before the lock
listener {
    timeout = 180
    on-timeout = qs -c tenka ipc call drift open
    on-resume = qs -c tenka ipc call drift hide
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

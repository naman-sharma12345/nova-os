// Tenka autoconfig (first line is skipped by Firefox).
// Registers ~/.config/tenka/firefox.css as a user sheet: tenka-theme writes the current
// theme's copy there, so Samurai/Xianxia colours follow the desk. No sheet, no change.
// The file is looked at every 2 s; when tenka-theme replaces it the sheet is swapped in the
// running browser, so a theme switch recolours Firefox without a restart.
try {
  const Cc = Components.classes, Ci = Components.interfaces;
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const cfgHome = env.get("XDG_CONFIG_HOME") || (env.get("HOME") + "/.config");
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  const path = cfgHome + "/tenka/firefox.css";
  let uri = null, stamp = -1;
  const tenkaSheet = function () {
    const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    f.initWithPath(path);
    const now = f.exists() ? f.lastModifiedTime : 0;
    if (now === stamp) return;
    stamp = now;
    if (uri && sss.sheetRegistered(uri, sss.USER_SHEET)) sss.unregisterSheet(uri, sss.USER_SHEET);
    uri = null;
    if (now) {   // a fresh query each time, so the new file is read rather than a cached sheet
      uri = io.newURI(io.newFileURI(f).spec + "?v=" + now);
      sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
    }
  };
  tenkaSheet();
  const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  timer.initWithCallback({ notify: function () { try { tenkaSheet(); } catch (e) {} } }, 2000, Ci.nsITimer.TYPE_REPEATING_SLACK);
  // a timer nobody holds is cancelled when it is collected: the observer service keeps this one for the session
  Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService)
    .addObserver({ observe: function () {}, timer: timer }, "tenka-theme-keepalive", false);
} catch (e) {}

// The Courtyard (Tianxia: The Pavilion): the new tab and the home page are /usr/share/tenka/newtab/index.html,
// drawn in the active pack (?t=<theme>, read from ~/.config/tenka/shell-theme.json and re-read when the theme
// sheet changes). The page is listed among each window's initial pages, so the address bar stays empty and
// takes the cursor, as it does on the stock new tab. A user who sets their own home page keeps it.
try {
  const Cc = Components.classes, Ci = Components.interfaces;
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const cfgHome = env.get("XDG_CONFIG_HOME") || (env.get("HOME") + "/.config");
  const PAGE = "file:///usr/share/tenka/newtab/index.html";
  const themeName = function () {
    try {
      const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      f.initWithPath(cfgHome + "/tenka/shell-theme.json");
      if (!f.exists()) return "samurai";
      const fis = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
      fis.init(f, -1, 0, 0);
      const sis = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
      sis.init(fis);
      const s = sis.read(Math.min(sis.available(), 4096));
      sis.close(); fis.close();
      const m = /"name"\s*:\s*"([a-z]+)"/.exec(s);
      return m ? m[1] : "samurai";
    } catch (e) { return "samurai"; }
  };
  let url = PAGE + "?t=" + themeName();
  defaultPref("browser.startup.homepage", url);
  defaultPref("browser.newtabpage.enabled", true);
  defaultPref("browser.toolbars.bookmarks.visibility", "never");   // the page is the whole tab: no "place your bookmarks here" strip
  const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  const point = function () {
    try {
      const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
      if (AboutNewTab.newTabURL !== url) AboutNewTab.newTabURL = url;
    } catch (e) {}
  };
  const blank = function (win) {   // the page counts as an empty tab: no address shown, the cursor in the bar
    try {
      // Firefox matches an initial page without its query (isInitialPage: prePath + filePath), so the bare path is the key
      if (win.gInitialPages && !win.gInitialPages.includes(PAGE)) win.gInitialPages.push(PAGE);
    } catch (e) {}
  };
  const keeper = {
    observe: function (subject, topic) {
      if (topic === "browser-delayed-startup-finished") { point(); blank(subject); }
      else if (topic === "final-ui-startup") point();
    }
  };
  obs.addObserver(keeper, "final-ui-startup", false);
  obs.addObserver(keeper, "browser-delayed-startup-finished", false);
  point();
  // follow a theme switch: the same 2 s look as the sheet above, by the theme file's own stamp
  let stamp = -1;
  const t2 = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  t2.initWithCallback({ notify: function () {
    try {
      const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      f.initWithPath(cfgHome + "/tenka/shell-theme.json");
      const now = f.exists() ? f.lastModifiedTime : 0;
      if (now === stamp) return;
      stamp = now;
      const next = PAGE + "?t=" + themeName();
      if (next !== url) { url = next; defaultPref("browser.startup.homepage", url); point(); }
    } catch (e) {}
  } }, 2000, Ci.nsITimer.TYPE_REPEATING_SLACK);
  obs.addObserver({ observe: function () {}, timer: t2, keeper: keeper }, "tenka-newtab-keepalive", false);
} catch (e) {}

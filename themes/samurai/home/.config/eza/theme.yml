# Tenka for eza (generated by scripts/gen-themes.py). eza reads ~/.config/eza/theme.yml
colourful: true
filekinds:
  normal: {foreground: "#efe6d6"}
  directory: {foreground: "#c9a35a", is_bold: true}
  symlink: {foreground: "#7aa59b"}
  pipe: {foreground: "#6f86b8"}
  block_device: {foreground: "#c9a35a"}
  char_device: {foreground: "#c9a35a"}
  socket: {foreground: "#6f86b8"}
  special: {foreground: "#c9a35a"}
  executable: {foreground: "#7d8f5a", is_bold: true}
  mount_point: {foreground: "#c9a35a", is_bold: true, is_underline: true}
perms:
  user_read: {foreground: "#b8ab96"}
  user_write: {foreground: "#c9a35a"}
  user_execute_file: {foreground: "#7d8f5a", is_bold: true}
  user_execute_other: {foreground: "#7d8f5a"}
  group_read: {foreground: "#b8ab96"}
  group_write: {foreground: "#c9a35a"}
  group_execute: {foreground: "#7d8f5a"}
  other_read: {foreground: "#b8ab96"}
  other_write: {foreground: "#d8412f"}
  other_execute: {foreground: "#7d8f5a"}
  special_user_file: {foreground: "#d8412f"}
  special_other: {foreground: "#d8412f"}
  attribute: {foreground: "#7d7466"}
size:
  major: {foreground: "#b8ab96"}
  minor: {foreground: "#b8ab96"}
  number_byte: {foreground: "#b8ab96"}
  number_kilo: {foreground: "#b8ab96"}
  number_mega: {foreground: "#efe6d6"}
  number_giga: {foreground: "#c9a35a"}
  number_huge: {foreground: "#d8412f"}
  unit_byte: {foreground: "#7d7466"}
  unit_kilo: {foreground: "#7d7466"}
  unit_mega: {foreground: "#7d7466"}
  unit_giga: {foreground: "#c9a35a"}
  unit_huge: {foreground: "#d8412f"}
users:
  user_you: {foreground: "#b8ab96"}
  user_root: {foreground: "#d8412f"}
  user_other: {foreground: "#7d7466"}
  group_yours: {foreground: "#7d7466"}
  group_other: {foreground: "#7d7466"}
  group_root: {foreground: "#d8412f"}
links:
  normal: {foreground: "#b8ab96"}
  multi_is_hard: {foreground: "#c9a35a"}
git:
  new: {foreground: "#7d8f5a"}
  modified: {foreground: "#c9a35a"}
  deleted: {foreground: "#d8412f"}
  renamed: {foreground: "#6f86b8"}
  typechange: {foreground: "#6f86b8"}
  ignored: {foreground: "#7d7466"}
  conflicted: {foreground: "#d8412f", is_bold: true}
git_repo:
  branch_main: {foreground: "#b8ab96"}
  branch_other: {foreground: "#c9a35a"}
  git_clean: {foreground: "#7d8f5a"}
  git_dirty: {foreground: "#c9a35a"}
file_type:
  image: {foreground: "#f2a7b5"}
  video: {foreground: "#f2a7b5"}
  music: {foreground: "#7aa59b"}
  lossless: {foreground: "#7aa59b"}
  crypto: {foreground: "#6f86b8"}
  document: {foreground: "#efe6d6"}
  compressed: {foreground: "#d8412f"}
  temp: {foreground: "#7d7466"}
  compiled: {foreground: "#7d7466"}
  build: {foreground: "#c9a35a", is_underline: true}
  source: {foreground: "#efe6d6"}
punctuation: {foreground: "#5b554f"}
date: {foreground: "#7d7466"}
inode: {foreground: "#7d7466"}
blocks: {foreground: "#7d7466"}
header: {foreground: "#b8ab96", is_underline: true}
octal: {foreground: "#7d7466"}
flags: {foreground: "#7d7466"}
symlink_path: {foreground: "#7aa59b"}
control_char: {foreground: "#d8412f"}
broken_symlink: {foreground: "#d8412f"}
broken_path_overlay: {foreground: "#d8412f", is_underline: true}

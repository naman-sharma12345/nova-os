name: Build ISO

on:
  push:
    tags: ["v*"]
  # the nightly really is nightly: main's head is rebuilt into the "nightly" pre-release at 03:00 IST
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the ISO to (e.g. v0.1.0; 'nightly' = a pre-release of main's head)"
        required: false
        default: ""

permissions:
  contents: write

# one ISO build at a time: a scheduled nightly and a manual one never race to replace the same release
concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # which release this run feeds: a scheduled run is the nightly, a manual one names its tag (or none = test build)
      REL: ${{ github.event_name == 'schedule' && 'nightly' || github.event.inputs.tag || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Build the ISO in a Debian 13 container
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso \
              grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools python3 python3-pil rsync \
              librsvg2-bin ca-certificates make zstd fonts-inter python3-numpy tzdata \
              qt6-declarative-dev-tools
            make iso BUILD=/src/build
          '
          ls -lh build/live/*.iso

      - name: Checksums
        run: |
          cd build/live
          for f in *.iso; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      # a manual run with no tag is a test build: keep the ISO as a short-lived artifact, no release/tag
      - name: Keep the ISO as an artifact (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && env.REL == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tenka-iso-${{ github.sha }}
          path: |
            build/live/*.iso
            build/live/*.iso.sha256
          retention-days: 3
          compression-level: 0

      # the nightly is rebuilt in place: drop the old pre-release and its tag so the new one points at this commit
      - name: Replace the nightly pre-release
        if: ${{ env.REL == 'nightly' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag -y || true

      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/') || env.REL != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL || github.ref_name }}
          name: Tenka ${{ env.REL || github.ref_name }}
          draft: false
          prerelease: ${{ env.REL == 'nightly' }}
          make_latest: ${{ env.REL != 'nightly' }}
          overwrite_files: true
          files: |
            build/live/*.iso
            build/live/*.iso.sha256

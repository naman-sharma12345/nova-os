# Tenka: calamares-settings-debian's packages.conf, with the live packages split in two (see operations below).
backend: apt

operations:
  # Tenka: the target has no apt lists (the ISO carries no pool), so apt can't even locate packages that aren't
  # installed, and one "Unable to locate package live-task-localisation" made the whole remove a hard
  # "Package Manager error" (REAL-VM, d4bb378 nightly). Remove what the image really installs; try the rest.
  - remove:
      - 'live-boot'
      - 'live-boot-initramfs-tools'
      - 'live-config'
      - 'live-config-systemd'
      - 'calamares-settings-debian'
  - try_remove:
      - 'live-boot-doc'
      - 'live-config-doc'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'

# Tenka status line for tmux (generated by scripts/gen-themes.py)
set -g status-style "bg=#0a0908,fg=#b8ab96"
set -g status-left " #[fg=#d8412f]#S #[fg=#2a2522]│ "
set -g status-right "#[fg=#7d7466]%H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#efe6d6,bg=#1b1816] #I #W "
set -g pane-border-style "fg=#2a2522"
set -g pane-active-border-style "fg=#d8412f"
set -g message-style "bg=#1b1816,fg=#efe6d6"
set -g mode-style "bg=#5d261f,fg=#efe6d6"
set -g clock-mode-colour "#d8412f"

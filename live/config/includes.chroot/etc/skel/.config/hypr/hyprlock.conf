# Tenka · hyprlock (the fallback lock when the Tenka shell is not running): Rice V frosted.
# The art under a milky frost (lighter, its colour reads through); one sheet of washi glass at the
# left holding the hour's old name, a huge Marcellus clock with the day's seal, the pack's line and
# one quiet pill for the word that opens it. A 1 px lit edge, a soft low shadow, no glow.
# Colours and words come from colors.conf (per theme).
source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 7, soft
    animation = fadeOut, 1, 5, soft
    animation = inputFieldDots, 1, 3, soft
}

background {
    monitor =
    path = ~/.cache/tenka/wallpaper
    color = $base
    blur_passes = 4
    blur_size = 7
    noise = 0.03
    brightness = 0.84
    contrast = 1.0
    vibrancy = 0.30
    vibrancy_darkness = 0.2
}

# the washi sheet behind the type: a thin ink tint over the frost, a lit hairline that fades from the
# theme's metal to almost nothing, and a soft low shadow so it sits above the art
shape {
    monitor =
    size = 820, 650
    color = rgba($base_hex61)
    rounding = $rounding
    border_size = 1
    border_color = rgba($accent2_hex4d) rgba($text_hex0d) 90deg
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 96, 20
    halign = left
    valign = center
    zindex = -1
}

label {
    monitor =
    text = cmd[update:60000] echo "◆   $(tenka-clock --hour | tr '[:lower:]' '[:upper:]')"
    color = $accent2
    font_size = 15
    font_family = $font_display
    position = 136, 290
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = $text
    font_size = 190
    font_family = $font_display
    position = 126, 140
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = cmd[update:60000] date +"%p"
    color = $text
    font_size = 20
    font_family = $font_display
    position = 760, 210
    halign = left
    valign = center
}

image {
    monitor =
    path = ~/.cache/tenka/seal.png
    size = 92
    rounding = 0
    border_size = 0
    position = 756, 120
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %-d" | tr '[:lower:]' '[:upper:]'
    color = rgba(255, 248, 236, 0.95)
    font_size = 15
    font_family = $font_display
    position = 768, 120
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%B %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba($text_hexd0)
    font_size = 16
    font_family = $font_display
    position = 140, -20
    halign = left
    valign = center
}

label {
    monitor =
    text = $lock_title
    color = $text
    font_size = 26
    font_family = $font_display
    position = 140, -90
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 380, 56
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = false
    dots_rounding = -1
    outer_color = rgba($accent2_hex80)
    inner_color = rgba($mantle_hex8c)
    font_color = $text
    font_family = $font_display
    check_color = $accent2
    fail_color = $accent
    fade_on_empty = false
    placeholder_text = <span foreground="##$subtext_hex">$lock_ph</span>
    fail_text = <span foreground="##$accent_hex">$FAIL</span>
    rounding = -1
    position = 140, -190
    halign = left
    valign = center
    shadow_passes = 2
}

label {
    monitor =
    text = $lock_sub
    color = $subtext
    font_size = 11
    font_family = Inter
    position = 148, -250
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$USER"
    color = rgba($text_hex99)
    font_size = 12
    font_family = $font_display
    position = -40, 36
    halign = right
    valign = bottom
}

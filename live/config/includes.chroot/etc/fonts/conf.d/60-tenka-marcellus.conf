<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tenka: Marcellus has one face (Regular). Ask for it bold (a <b> in markup, a bold title) and the text
     would otherwise come back in a bold sans. Keep the request on the one face, never a fake bold. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Marcellus</string></test>
    <test name="weight" compare="more"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="font">
    <test name="family"><string>Marcellus</string></test>
    <edit name="embolden" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>

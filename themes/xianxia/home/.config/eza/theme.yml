# Tianxia for eza (generated by scripts/gen-themes.py). eza reads ~/.config/eza/theme.yml
colourful: true
filekinds:
  normal: {foreground: "#eef3ec"}
  directory: {foreground: "#e2bd6b", is_bold: true}
  symlink: {foreground: "#6fd3c6"}
  pipe: {foreground: "#8fb3d1"}
  block_device: {foreground: "#e2bd6b"}
  char_device: {foreground: "#e2bd6b"}
  socket: {foreground: "#8fb3d1"}
  special: {foreground: "#e2bd6b"}
  executable: {foreground: "#5fc9a0", is_bold: true}
  mount_point: {foreground: "#e2bd6b", is_bold: true, is_underline: true}
perms:
  user_read: {foreground: "#a9bdb4"}
  user_write: {foreground: "#e2bd6b"}
  user_execute_file: {foreground: "#5fc9a0", is_bold: true}
  user_execute_other: {foreground: "#5fc9a0"}
  group_read: {foreground: "#a9bdb4"}
  group_write: {foreground: "#e2bd6b"}
  group_execute: {foreground: "#5fc9a0"}
  other_read: {foreground: "#a9bdb4"}
  other_write: {foreground: "#5fc9a0"}
  other_execute: {foreground: "#5fc9a0"}
  special_user_file: {foreground: "#5fc9a0"}
  special_other: {foreground: "#5fc9a0"}
  attribute: {foreground: "#72827c"}
size:
  major: {foreground: "#a9bdb4"}
  minor: {foreground: "#a9bdb4"}
  number_byte: {foreground: "#a9bdb4"}
  number_kilo: {foreground: "#a9bdb4"}
  number_mega: {foreground: "#eef3ec"}
  number_giga: {foreground: "#e2bd6b"}
  number_huge: {foreground: "#5fc9a0"}
  unit_byte: {foreground: "#72827c"}
  unit_kilo: {foreground: "#72827c"}
  unit_mega: {foreground: "#72827c"}
  unit_giga: {foreground: "#e2bd6b"}
  unit_huge: {foreground: "#5fc9a0"}
users:
  user_you: {foreground: "#a9bdb4"}
  user_root: {foreground: "#5fc9a0"}
  user_other: {foreground: "#72827c"}
  group_yours: {foreground: "#72827c"}
  group_other: {foreground: "#72827c"}
  group_root: {foreground: "#5fc9a0"}
links:
  normal: {foreground: "#a9bdb4"}
  multi_is_hard: {foreground: "#e2bd6b"}
git:
  new: {foreground: "#5fc9a0"}
  modified: {foreground: "#e2bd6b"}
  deleted: {foreground: "#5fc9a0"}
  renamed: {foreground: "#8fb3d1"}
  typechange: {foreground: "#8fb3d1"}
  ignored: {foreground: "#72827c"}
  conflicted: {foreground: "#5fc9a0", is_bold: true}
git_repo:
  branch_main: {foreground: "#a9bdb4"}
  branch_other: {foreground: "#e2bd6b"}
  git_clean: {foreground: "#5fc9a0"}
  git_dirty: {foreground: "#e2bd6b"}
file_type:
  image: {foreground: "#f0a3b8"}
  video: {foreground: "#f0a3b8"}
  music: {foreground: "#6fd3c6"}
  lossless: {foreground: "#6fd3c6"}
  crypto: {foreground: "#8fb3d1"}
  document: {foreground: "#eef3ec"}
  compressed: {foreground: "#5fc9a0"}
  temp: {foreground: "#72827c"}
  compiled: {foreground: "#72827c"}
  build: {foreground: "#e2bd6b", is_underline: true}
  source: {foreground: "#eef3ec"}
punctuation: {foreground: "#51635e"}
date: {foreground: "#72827c"}
inode: {foreground: "#72827c"}
blocks: {foreground: "#72827c"}
header: {foreground: "#a9bdb4", is_underline: true}
octal: {foreground: "#72827c"}
flags: {foreground: "#72827c"}
symlink_path: {foreground: "#6fd3c6"}
control_char: {foreground: "#5fc9a0"}
broken_symlink: {foreground: "#5fc9a0"}
broken_path_overlay: {foreground: "#5fc9a0", is_underline: true}

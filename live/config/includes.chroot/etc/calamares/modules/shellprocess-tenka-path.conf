# Tenka: carry the path chosen in the live session (Samurai or Xianxia) onto the installed system.
# Runs on the live side (it reads the live choice) and chroots into the target itself.
---
dontChroot: true
timeout: 600
script:
    - "-/usr/libexec/tenka/tenka-install-path ${ROOT}"
i18n:
    name: "Keeping your path"

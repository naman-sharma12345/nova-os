[Service]
# Written by tenka-session-default at every boot: tumblerd's own gdk-pixbuf loader list without AVIF/HEIF/WebP/SVG
# (those run one helper process per file via tenka-pixbuf.thumbnailer, so a decoder crash costs one thumbnail),
# and the list that helper uses (no AVIF under pure CPU emulation, where dav1d crashed). Absent file = stock tumbler.
EnvironmentFile=-/run/tenka/tumbler.env

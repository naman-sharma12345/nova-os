# Tianxia status line for tmux (generated by scripts/gen-themes.py)
set -g status-style "bg=#07100e,fg=#a9bdb4"
set -g status-left " #[fg=#5fc9a0]#S #[fg=#1d332e]│ "
set -g status-right "#[fg=#72827c]%H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#eef3ec,bg=#12211e] #I #W "
set -g pane-border-style "fg=#1d332e"
set -g pane-active-border-style "fg=#5fc9a0"
set -g message-style "bg=#12211e,fg=#eef3ec"
set -g mode-style "bg=#2d5c4c,fg=#eef3ec"
set -g clock-mode-colour "#5fc9a0"

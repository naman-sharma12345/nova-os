// Tenka autoconfig (first line is skipped by Firefox).
// Registers ~/.config/tenka/firefox.css as a user sheet: tenka-theme writes the current
// theme's copy there, so Samurai/Xianxia colours follow the desk. No sheet, no change.
try {
  const Cc = Components.classes, Ci = Components.interfaces;
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const cfgHome = env.get("XDG_CONFIG_HOME") || (env.get("HOME") + "/.config");
  const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  f.initWithPath(cfgHome + "/tenka/firefox.css");
  if (f.exists()) {
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    const uri = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService).newFileURI(f);
    if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {}

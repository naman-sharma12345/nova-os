name: Build ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the ISO to (e.g. v0.1.0; 'nightly' = a pre-release of main's head)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Build the ISO in a Debian 13 container
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso \
              grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools python3 python3-pil rsync \
              librsvg2-bin ca-certificates make zstd fonts-inter python3-numpy
            make iso BUILD=/src/build
          '
          ls -lh build/live/*.iso

      - name: Checksums
        run: |
          cd build/live
          for f in *.iso; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      # a manual run with no tag is a test build: keep the ISO as a short-lived artifact, no release/tag
      - name: Keep the ISO as an artifact (test build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tenka-iso-${{ github.sha }}
          path: |
            build/live/*.iso
            build/live/*.iso.sha256
          retention-days: 3
          compression-level: 0

      # the nightly is rebuilt in place: drop the old pre-release and its tag so the new one points at this commit
      - name: Replace the nightly pre-release
        if: ${{ github.event.inputs.tag == 'nightly' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag -y || true

      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Tenka ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.tag == 'nightly' }}
          make_latest: ${{ github.event.inputs.tag != 'nightly' }}
          overwrite_files: true
          files: |
            build/live/*.iso
            build/live/*.iso.sha256
